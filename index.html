<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <form action="">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="full-name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="password">Enter Password</label>
            <input type="password" id="password" name="password">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password">

            <input type="submit" value="Update Profile">
        </form>
    </main>
    <aside>
            <section id="progress-bar" class="progress-bar">65%</section>
            <label for="progress-bar">Profile Completeness</label>

            <section class="checklist">
                <ul>
                    <li>Create Account</li>
                    <li>Update Roadmap Progress</li>
                    <li>Setup Public Profile</li>
                    <li>Complete Your First Project</li>
                    <li>Invite Your Friends</li>
                </ul>
            </section>
    </aside>
</body>

</html>
