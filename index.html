<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Form UI</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <form class="form" action="">
            <label class="label" for="full-name">
                Full Name
                <input class="input" type="text" id="full-name" name="full-name" placeholder="What should we call you?"
                    required>
            </label>


            <label class="label" for="email">
                Email
                <input class="input" type="email" id="email" name="email" placeholder="e.g. name@example.com">
            </label>


            <label class="label" for="password">
                Enter Password
                <div class="password-container">
                    <input class="input" type="password" id="password" name="password" placeholder="xxxxxxxx"
                        maxlength="8">
                    <button class="eye-button" type="button"><img class="eye-icon" src="./assets/icons/eye.svg"
                            alt=""></button>
                </div>
            </label>

            <label class="label" for="confirm-password">
                Confirm Password
                <div class="password-container">
                    <input class="input" type="password" id="confirm-password" name="confirm-password"
                        placeholder="xxxxxxxx" maxlength="8">
                    <button class="eye-button" type="button"><img class="eye-icon" src="./assets/icons/eye.svg"
                            alt=""></button>
                </div>
            </label>

            <input class="submit" type="submit" value="Update Profile">
        </form>
    </main>
    <aside>
        <section id="progress-bar" class="progress-bar">65%</section>
        <label for="progress-bar">Profile Completeness</label>

        <section class="checklist">
            <ul>
                <li>Create Account</li>
                <li>Update Roadmap Progress</li>
                <li>Setup Public Profile</li>
                <li>Complete Your First Project</li>
                <li>Invite Your Friends</li>
            </ul>
        </section>
    </aside>
</body>

</html>
